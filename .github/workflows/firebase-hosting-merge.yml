name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install
      - run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: daisysdailies
          workload_identity_provider: projects/244424849672/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-action-1318788783@daisysdailies.iam.gserviceaccount.com

      - run: npx firebase-tools deploy --only hosting --project daisysdailies --non-interactive
